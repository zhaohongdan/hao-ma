<style>

    min-height: 100vh;
    padding: 24px 16px 48px;
  }
  .header { text-align: center; margin-bottom: 20px; }
  .header .badge {
    display: inline-block; background: #ff7a45; color: #fff; font-size: 12px;
    padding: 4px 12px; border-radius: 999px; margin-bottom: 10px; letter-spacing: 1px;
  }
  .header h1 { font-size: 22px; color: #1a1a1a; line-height: 1.4; }
  .header p { font-size: 13px; color: #888; margin-top: 6px; }
  .search-box {
    background: #fff; border-radius: 16px; padding: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08); margin-bottom: 14px;
  }
  .search-row { display: flex; gap: 8px; }
  .search-row input {
    flex: 1; height: 46px; border: 2px solid #e8e8e8; border-radius: 12px;
    padding: 0 14px; font-size: 16px; outline: none; transition: border .2s;
    background: #fafafa;
  }
  .search-row input:focus { border-color: #ff7a45; background: #fff; }
  .search-row button {
    height: 46px; padding: 0 20px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, #ff7a45, #ff5f3c); color: #fff;
    font-size: 16px; font-weight: 600; cursor: pointer; white-space: nowrap;
    box-shadow: 0 4px 12px rgba(255,95,60,.35);
  }
  .search-row button:active { transform: scale(.97); }
  .tips {
    display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px;
  }
  .tips span {
    font-size: 12px; color: #777; background: #f5f5f5; border-radius: 999px; padding: 3px 10px;
  }
  .hint { font-size: 12px; color: #aaa; text-align: center; margin-bottom: 14px; }
  .stats { font-size: 12px; color: #999; text-align: center; margin-bottom: 4px; }
  .result-card {
    background: #fff; border-radius: 14px; padding: 16px 18px; margin-bottom: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,.06); border-left: 5px solid #ff7a45;
    animation: slideIn .25s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none;} }
  .result-card .tag {
    display: inline-block; font-size: 11px; background: #fff3e8; color: #ff7a45;
    padding: 2px 8px; border-radius: 6px; margin-bottom: 8px;
  }
  .result-card .name-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .result-card .parent { font-size: 18px; font-weight: 700; color: #222; }
  .result-card .child { font-size: 15px; color: #555; }
  .result-card .race {
    font-size: 13px; color: #ff7a45; font-weight: 700; background: #fff3e8;
    padding: 2px 10px; border-radius: 999px; margin-top: 6px; display: inline-block;
  }
  .empty {
    text-align: center; color: #999; padding: 40px 0; font-size: 14px;
  }
  .empty .big { font-size: 40px; margin-bottom: 10px; }
  .footer { text-align: center; font-size: 11px; color: #bbb; margin-top: 24px; line-height: 1.8; }
</style>

function esc(s) {
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function normalize(s) {
  return String(s||'').trim().toLowerCase().replace(/\s+/g,'');
}

function matchRace(q, raceNo) {
  var r = normalize(raceNo); // a001
  var qq = normalize(q);
  // a001 / 001 / 1 -> 1 ; only exact number match (not prefix)
  if (/^[a]?\d+$/.test(qq)) {
    var num = parseInt(qq.replace(/^a/, '').replace(/^0+/, ''), 10);
    var raceNum = parseInt(r.replace(/^a/, '').replace(/^0+/, ''), 10);
    if (!isNaN(num) && num === raceNum) return true;
  }
  return r === qq;
}

function search(q) {
  q = q.trim();
  if (!q) return [];
  var nq = normalize(q);
  if (!nq) return [];

  // exact matches first
  var exact = DATA.filter(function(r){
    return normalize(r.parent) === nq || normalize(r.child) === nq;
  });
  if (exact.length) return exact;

  // race number
  var race = DATA.filter(function(r){ return matchRace(q, r.race_no); });
  if (race.length) return race;

  // fuzzy substring on parent or child
  var fuzzy = DATA.filter(function(r){
    return normalize(r.parent).indexOf(nq) !== -1 || normalize(r.child).indexOf(nq) !== -1;
  });
  return fuzzy;
}

function render(results, q) {
  listEl.innerHTML = '';
  if (!results.length) {
    listEl.innerHTML = '<div class="empty"><div class="big">🤔</div>没有找到与「' + esc(q) + '」匹配的记录<br>请检查姓名或比赛号是否输入正确</div>';
    return;
  }
  if (results.length > 30) {
    listEl.innerHTML = '<div class="empty"><div class="big">🔍</div>匹配结果过多（' + results.length + ' 条），请输入更精确的姓名</div>';
    return;
  }
  results.forEach(function(r){
    var card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML =
      '<span class="tag">第 ' + r.no + ' 号</span>' +
      '<div class="name-row"><span class="parent">' + esc(r.parent) + '</span>' +
      '<span class="child">' + esc(r.child) + '（' + esc(r.gender) + '）</span></div>' +
      '<span class="race">🏅 比赛号 ' + esc(r.race_no) + '</span>';
    listEl.appendChild(card);
  });
}

function run() {
  var q = kwEl.value.trim();
  render(search(q), q);
}

document.getElementById('btn').addEventListener('click', run);
kwEl.addEventListener('keydown', function(e){ if (e.key === 'Enter') run(); });

document.getElementById('stats').textContent = '共 ' + DATA.length + ' 位儿童，' + new Set(DATA.map(function(r){return r.parent;})).size + ' 个家庭';
document.getElementById('cnt').textContent = DATA.length;

// auto focus for mobile friendliness (but not auto-triggering keyboard on WeChat scan)
// initial hint
listEl.innerHTML = '<div class="empty"><div class="big">🏃</div>欢迎使用号码查询<br>输入家长或孩子的姓名，即可查询比赛号码</div>';
</script>
</body>
</html>
